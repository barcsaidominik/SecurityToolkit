# Generated by `security-toolkit infra install --mssql`; rewritten on every rerun, do not edit.
# Shared, test-only SQL Server. Every project gets its own login via
# `security-toolkit infra add-test-login <name>` and its tests create/drop their own databases.
name: security-toolkit-mssql
services:
  mssql:
    image: ${MSSQL_IMAGE:?Set MSSQL_IMAGE}
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD}
      MSSQL_MEMORY_LIMIT_MB: ${MSSQL_MEMORY_LIMIT_MB:-2048}
      # sqlcmd reads the password from here, so it never appears on a command line.
      SQLCMDPASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      # Loopback only: the agent runs on the same machine, nothing else needs to reach it.
      - "127.0.0.1:${MSSQL_PORT:-14333}:1433"
    volumes:
      - ./sql:/scripts:ro
    mem_limit: 3g
    # No data volume on purpose: test data is disposable. A plain restart keeps logins and data;
    # `down` + `up` wipes everything, after which every project's test login must be re-added.
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -b -S localhost -U sa -Q 'SELECT 1' -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
