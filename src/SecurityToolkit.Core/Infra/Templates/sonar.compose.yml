# Generated by `security-toolkit infra install --sonar`; rewritten on every rerun, do not edit.
# Machine-wide SonarQube + PostgreSQL shared by every project the toolkit is installed into.
# The project name must stay "security-toolkit-sonar": the named volumes below carry it as a
# prefix, so keeping it is what preserves existing Sonar data across reinstalls/moves.
name: security-toolkit-sonar
services:
  db:
    image: ${POSTGRES_IMAGE:?Set POSTGRES_IMAGE}
    environment:
      POSTGRES_USER: sonar
      POSTGRES_DB: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:?Set SONAR_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  sonarqube:
    image: ${SONAR_IMAGE:?Set SONAR_IMAGE}
    depends_on:
      db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:?Set SONAR_DB_PASSWORD}
    ports:
      - "${SONAR_PORT:-9000}:9000"
    mem_limit: ${SONAR_MEM_LIMIT:-4g}
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
      nproc: 8192
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_logs:/opt/sonarqube/logs
      - sonar_extensions:/opt/sonarqube/extensions
    restart: unless-stopped
volumes:
  postgres_data:
  sonar_data:
  sonar_logs:
  sonar_extensions:
